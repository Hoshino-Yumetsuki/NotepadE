name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package installer (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-nsis
            glob: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact: linux-deb-appimage
            glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            artifact: macos-dmg
            glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 'lts/*'
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            libssl-dev
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Corepack
        run: |
          corepack enable
          corepack prepare
      - name: Setup Dependencies
        run: |
          yarn install --immutable
      - name: Build installer (tauri build)
        run: yarn dist
      - name: Upload installer artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Read release version
        id: version
        run: node -p '"tag=v" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          skipIfReleaseExists: true
          artifacts: release/**/*.deb,release/**/*.AppImage,release/**/*.exe,release/**/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          makeLatest: ${{ !contains(steps.version.outputs.tag, '-') }}
